# Named `simulator` so SIMULATOR_URL (http://simulator:8080) resolves as it does
# in compose.
apiVersion: v1
kind: Service
metadata:
  name: simulator
  namespace: relay
  labels:
    app.kubernetes.io/name: relay-simulator
    app.kubernetes.io/part-of: relay
spec:
  selector:
    app.kubernetes.io/name: relay-simulator
  ports:
    - name: http
      port: 8080
      targetPort: http
