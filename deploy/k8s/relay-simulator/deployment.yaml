apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-simulator
  namespace: relay
  labels:
    app.kubernetes.io/name: relay-simulator
    app.kubernetes.io/part-of: relay
spec:
  # One replica: the active failure mode is held in process memory, so a
  # second replica would answer with a different scenario.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: relay-simulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relay-simulator
        app.kubernetes.io/part-of: relay
    spec:
      enableServiceLinks: false
      containers:
        - name: simulator
          image: relay:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "simulator.main:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: relay-config
          env:
            # Verifies the signature on every webhook the dispatcher sends.
            - name: RELAY_WEBHOOK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: relay-secrets
                  key: RELAY_WEBHOOK_SIGNING_SECRET
          # Same check as the compose healthcheck.
          readinessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
