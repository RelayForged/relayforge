# Named `dispatcher`, the same hostname as the compose service, so
# deploy/prometheus.yml (target dispatcher:9100) works unchanged. The Service
# exists only to give Prometheus a stable address for the metrics port.
apiVersion: v1
kind: Service
metadata:
  name: dispatcher
  namespace: relay
  labels:
    app.kubernetes.io/name: relay-dispatcher
    app.kubernetes.io/part-of: relay
spec:
  selector:
    app.kubernetes.io/name: relay-dispatcher
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-dispatcher
  namespace: relay
  labels:
    app.kubernetes.io/name: relay-dispatcher
    app.kubernetes.io/part-of: relay
spec:
  # The autoscaler (hpa.yaml or scaledobject.yaml, never both) owns the count.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: relay-dispatcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relay-dispatcher
        app.kubernetes.io/part-of: relay
    spec:
      enableServiceLinks: false
      containers:
        - name: dispatcher
          image: relay:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "relay.data_plane.dispatcher.main"]
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: relay-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: relay-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: relay-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: relay-secrets
                  key: REDIS_PASSWORD
            - name: RELAY_WEBHOOK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: relay-secrets
                  key: RELAY_WEBHOOK_SIGNING_SECRET
            - name: DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/relaydb
            - name: ASYNC_DATABASE_URL
              value: postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/relaydb
            - name: REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@redis:6379/0
          # NO PROBES YET, on purpose. The dispatcher is a Kafka consumer with no
          # HTTP route; its only listener will be the metrics port, and nothing
          # opens it until the dispatcher calls start_metrics_server() at startup
          # (Person B, T7). A probe on 9100 today would never pass, and a liveness
          # probe would restart-loop the pod.
          #
          # Once that call lands, enable both:
          #
          # readinessProbe:
          #   tcpSocket:
          #     port: metrics
          #   initialDelaySeconds: 10
          #   periodSeconds: 5
          #   failureThreshold: 6
          # livenessProbe:
          #   tcpSocket:
          #     port: metrics
          #   initialDelaySeconds: 30
          #   periodSeconds: 15
          #   failureThreshold: 4
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi
