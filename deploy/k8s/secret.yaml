# PLACEHOLDERS ONLY. Replace every CHANGE_ME before `kubectl apply`; do not
# commit real values. These are not the docker-compose dev credentials.
#
# Postgres and Redis passwords are interpolated into connection URLs, so use
# URL-safe characters (letters, digits, - and _).
apiVersion: v1
kind: Secret
metadata:
  name: relay-secrets
  namespace: relay
  labels:
    app.kubernetes.io/part-of: relay
type: Opaque
stringData:
  POSTGRES_USER: "CHANGE_ME"
  POSTGRES_PASSWORD: "CHANGE_ME"
  REDIS_PASSWORD: "CHANGE_ME"
  # Signs outbound webhooks (dispatcher) and verifies them (simulator).
  RELAY_WEBHOOK_SIGNING_SECRET: "CHANGE_ME"
  # Comma-separated owner_id:secret pairs. Required outside dev, or the API
  # answers 503. Clients send the secret in the X-API-Key header.
  RELAY_API_KEYS: "demo-owner:CHANGE_ME"
  GRAFANA_ADMIN_PASSWORD: "CHANGE_ME"
