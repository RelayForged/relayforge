apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-dashboard
  namespace: relay
  labels:
    app.kubernetes.io/name: relay-dashboard
    app.kubernetes.io/part-of: relay
spec:
  # One replica on purpose: the dashboard builds its live view from a Kafka
  # consumer group in process memory, so a second replica would show only the
  # partitions it was assigned.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: relay-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relay-dashboard
        app.kubernetes.io/part-of: relay
    spec:
      enableServiceLinks: false
      containers:
        - name: dashboard
          image: relay:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "relay.dashboard.main:app", "--host", "0.0.0.0", "--port", "8090"]
          ports:
            - name: http
              containerPort: 8090
          envFrom:
            - configMapRef:
                name: relay-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: relay-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: relay-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: relay-secrets
                  key: REDIS_PASSWORD
            - name: DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/relaydb
            - name: ASYNC_DATABASE_URL
              value: postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/relaydb
            - name: REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@redis:6379/0
          # Same check as the compose healthcheck.
          readinessProbe:
            httpGet:
              path: /api/chart/endpoints
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/chart/endpoints
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
