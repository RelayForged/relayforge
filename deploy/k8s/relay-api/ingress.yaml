# Ingress for the ingestion API only. The host is a placeholder and no TLS
# secret is checked in: add a `tls:` block and your own certificate secret
# before exposing this beyond a local cluster.
#
# The dashboard, simulator, Prometheus and Grafana stay internal; reach them
# with `kubectl port-forward`.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: relay-api
  namespace: relay
  labels:
    app.kubernetes.io/name: relay-api
    app.kubernetes.io/part-of: relay
spec:
  ingressClassName: nginx
  rules:
    - host: relay.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
