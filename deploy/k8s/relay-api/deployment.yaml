apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-api
  namespace: relay
  labels:
    app.kubernetes.io/name: relay-api
    app.kubernetes.io/part-of: relay
spec:
  # The HPA (hpa.yaml) owns the replica count once applied.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: relay-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relay-api
        app.kubernetes.io/part-of: relay
    spec:
      enableServiceLinks: false
      containers:
        - name: api
          image: relay:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "relay.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: relay-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: relay-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: relay-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: relay-secrets
                  key: REDIS_PASSWORD
            - name: RELAY_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: relay-secrets
                  key: RELAY_API_KEYS
            # $(VAR) expands only variables declared earlier in this list.
            - name: DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/relaydb
            - name: ASYNC_DATABASE_URL
              value: postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/relaydb
            - name: REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@redis:6379/0
          # Same check as the compose healthcheck.
          readinessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          # CPU requests are required for the HPA's utilization target.
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 512Mi
