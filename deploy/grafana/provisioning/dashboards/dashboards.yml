apiVersion: 1

# Loads every dashboard JSON found in /etc/grafana/dashboards, which compose
# mounts from deploy/grafana/dashboards. relay.json is added there by Person B.
providers:
  - name: relay
    folder: Relay
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 10
    options:
      path: /etc/grafana/dashboards
