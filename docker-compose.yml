# Local development harness only.
#
# Ports are bound to 127.0.0.1: Kafka is PLAINTEXT with no SASL and
# Postgres uses the dev credentials below, so publishing them on 0.0.0.0
# exposed unauthenticated read/write on the durable log and the database.
# Production credentials are enforced by relay/infrastructure/persistence/
# config.py, which refuses these defaults when RELAY_ENV is not 'dev'.
#
# `version:` is intentionally omitted -- obsolete and ignored by Compose v2.

services:
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    hostname: kafka
    container_name: kafka
    ports:
      # 29092 is the in-network broker listener; it does not need publishing.
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      # Was /tmp/kraft-combined-logs with no volume, so the entire durable
      # log -- including uncommitted events and scheduled retries -- was
      # destroyed on any container recreation (ADR 0002).
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-relay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relaypassword}
      POSTGRES_DB: ${POSTGRES_DB:-relaydb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relay} -d ${POSTGRES_DB:-relaydb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    # Not wired until Week 5-6 (three-tier PolicyCache), but it was
    # running with no authentication at all.
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-relaypassword}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-relaypassword} ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: relay-migrator
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-relay}:${POSTGRES_PASSWORD:-relaypassword}@postgres:5432/${POSTGRES_DB:-relaydb}
      ASYNC_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-relay}:${POSTGRES_PASSWORD:-relaypassword}@postgres:5432/${POSTGRES_DB:-relaydb}
      RELAY_ENV: dev
    depends_on:
      postgres:
        condition: service_healthy

  simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: relay-simulator
    command: ["uvicorn", "simulator.main:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:${SIMULATOR_PORT:-8088}:8080"
    environment:
      RELAY_ENV: dev
      RELAY_WEBHOOK_SIGNING_SECRET: ${RELAY_WEBHOOK_SIGNING_SECRET:-relay-dev-signing-secret}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/docs || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: relay-api
    command: ["uvicorn", "relay.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-relay}:${POSTGRES_PASSWORD:-relaypassword}@postgres:5432/${POSTGRES_DB:-relaydb}
      ASYNC_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-relay}:${POSTGRES_PASSWORD:-relaypassword}@postgres:5432/${POSTGRES_DB:-relaydb}
      REDIS_URL: redis://:${REDIS_PASSWORD:-relaypassword}@redis:6379/0
      RELAY_ENV: dev
      RELAY_ALLOW_PRIVATE_TARGETS: "true"
      AEDE_ENABLED: "true"
      ERI_ENABLED: "true"
      STATE_MACHINE_ENABLED: "true"
      AEDE_QUARANTINE_THRESHOLD: "30.0"
      # Demo scenario engine (relay/api/demo.py). Off unless enabled here.
      RELAY_DEMO_ENABLED: "true"
      SIMULATOR_URL: http://simulator:8080
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/docs || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  dispatcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: relay-dispatcher
    command: ["python", "-m", "relay.data_plane.dispatcher.main"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-relay}:${POSTGRES_PASSWORD:-relaypassword}@postgres:5432/${POSTGRES_DB:-relaydb}
      ASYNC_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-relay}:${POSTGRES_PASSWORD:-relaypassword}@postgres:5432/${POSTGRES_DB:-relaydb}
      REDIS_URL: redis://:${REDIS_PASSWORD:-relaypassword}@redis:6379/0
      RELAY_ENV: dev
      RELAY_ALLOW_PRIVATE_TARGETS: "true"
      AEDE_ENABLED: "true"
      ERI_ENABLED: "true"
      STATE_MACHINE_ENABLED: "true"
      AEDE_QUARANTINE_THRESHOLD: "30.0"
      # Short enough that a simulated outage collapses ERI within seconds.
      RELAY_WEBHOOK_TIMEOUT_SECONDS: "2"
      # RECOVERING needs this many observations before AVAILABLE (ADR 0023).
      AEDE_RECOVERY_MIN_SAMPLES: "25"
      # Dev-only signing secret; the simulator verifies with the same value.
      RELAY_HMAC_REQUIRED: "true"
      RELAY_WEBHOOK_SIGNING_SECRET: ${RELAY_WEBHOOK_SIGNING_SECRET:-relay-dev-signing-secret}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      simulator:
        condition: service_started

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: relay-dashboard
    command: ["uvicorn", "relay.dashboard.main:app", "--host", "0.0.0.0", "--port", "8090"]
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-relay}:${POSTGRES_PASSWORD:-relaypassword}@postgres:5432/${POSTGRES_DB:-relaydb}
      ASYNC_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-relay}:${POSTGRES_PASSWORD:-relaypassword}@postgres:5432/${POSTGRES_DB:-relaydb}
      REDIS_URL: redis://:${REDIS_PASSWORD:-relaypassword}@redis:6379/0
      RELAY_ENV: dev
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8090/api/chart/endpoints || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  kafka_data:
  redis_data:

